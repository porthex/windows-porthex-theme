[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=0
ContextTitle=Porthex settings
ContextAction=[!ActivateConfig "WindowsPorthexTheme\Settings" "Settings.ini"]

[Metadata]
Name=Porthex Taskbar Status
Author=Hermes
Information=Native-taskbar companion server status indicator.
Version=1.0

[Variables]
@Include=#@#Variables.inc
ServerState=ONLINE
ServerColor=95,210,140,255

[MeterHit]
Meter=Image
X=0
Y=0
W=156
H=28
SolidColor=16,18,18,1
LeftMouseUpAction=["https://sv1.porthex.io/"]
ToolTipText=Open sv1.porthex.io

[MeterDot]
Meter=Shape
X=12
Y=14
Shape=Ellipse 0,0,4,4 | Fill Color #ServerColor# | StrokeWidth 0
DynamicVariables=1

[MeterBrand]
Meter=String
X=24
Y=14
StringAlign=LeftCenter
FontFace=#UIFont#
FontSize=10
FontColor=#Silver#
AntiAlias=1
Text=Porthex

[MeterState]
Meter=String
X=82
Y=14
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Text=#ServerState#
DynamicVariables=1
