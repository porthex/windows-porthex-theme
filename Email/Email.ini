[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=0
ContextTitle4=Porthex settings
ContextAction4=[!ActivateConfig "WindowsPorthexTheme\Settings" "Settings.ini"]
ContextTitle=Hide Email
ContextAction=[!DeactivateConfig "WindowsPorthexTheme\Email"]
ContextTitle2=Refresh Google data
ContextAction2=[wscript.exe "#@#UpdateGoogleWidgets.vbs"]
ContextTitle3=Open Gmail
ContextAction3=["https://mail.google.com/mail/u/0/#inbox"]

[Metadata]
Name=Recent Email
Author=Hermes
Information=Three recent Gmail messages with direct links.
Version=2.0

[Variables]
@Include=#@#Variables.inc
EmailStatus=GOOGLE LOGIN REQUIRED
Email1From=CONNECT GMAIL
Email1Subject=Complete Google browser authorization.
Email1Url=https://mail.google.com/mail/u/0/#inbox
Email2From=-
Email2Subject=-
Email2Url=https://mail.google.com/mail/u/0/#inbox
Email3From=-
Email3Subject=-
Email3Url=https://mail.google.com/mail/u/0/#inbox

