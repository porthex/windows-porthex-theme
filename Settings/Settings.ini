[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
ContextTitle=Close Porthex settings
ContextAction=[!DeactivateConfig "WindowsPorthexTheme\Settings"]

[Metadata]
Name=Porthex Theme Settings
Author=Porthex
Information=Profiles, releases, updates, and documentation.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc
AutoUpdate=0
AutoUpdateLabel=OFF
InstalledVersion=1.0.2
LatestVersion=UNKNOWN
UpdateState=NOT CHECKED
UpdateDetail=Check GitHub for the latest release.
UpdateColor=129,127,120,255
LastChecked=NEVER
ProfileState=NOT CHECKED
ProfileDetail=Run setup to create Quiet, Work, and Deep Focus.
ProfileColor=129,127,120,255

[MeterPanel]
Meter=Image
X=0
Y=0
W=430
H=358
SolidColor=16,18,18,252

[MeterRule]
Meter=Image
X=0
Y=46
W=430
H=1
SolidColor=231,229,222,34

[MeterTitle]
Meter=String
X=18
Y=23
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=8
FontColor=#Silver#
AntiAlias=1
Text=PORTHEX THEME / SETTINGS

[MeterClose]
Meter=String
X=412
Y=23
StringAlign=RightCenter
FontFace=#MonoFont#
FontSize=8
FontColor=#Muted#
AntiAlias=1
Text=CLOSE
LeftMouseUpAction=[!DeactivateConfig "WindowsPorthexTheme\Settings"]

[MeterVersionLabel]
Meter=String
X=18
Y=72
FontFace=#MonoFont#
FontSize=7
FontColor=#Muted#
AntiAlias=1
Text=RELEASE

[MeterVersion]
Meter=String
X=18
Y=92
FontFace=#UIFont#
FontSize=10
FontColor=#Silver#
AntiAlias=1
Text=INSTALLED #InstalledVersion#  /  LATEST #LatestVersion#
DynamicVariables=1

[MeterUpdateDot]
Meter=Shape
X=20
Y=124
Shape=Ellipse 0,0,5,5 | Fill Color #UpdateColor# | StrokeWidth 0
DynamicVariables=1

[MeterUpdateState]
Meter=String
X=34
Y=126
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Silver#
AntiAlias=1
Text=#UpdateState#
DynamicVariables=1

[MeterUpdateDetail]
Meter=String
X=18
Y=145
W=394
H=28
FontFace=#UIFont#
FontSize=8
FontColor=#Muted#
AntiAlias=1
ClipString=2
Text=#UpdateDetail#
DynamicVariables=1

[MeterCheck]
Meter=String
X=18
Y=184
W=112
H=28
SolidColor=231,229,222,12
Padding=10,6,10,6
FontFace=#MonoFont#
FontSize=7
FontColor=#Silver#
AntiAlias=1
Text=CHECK UPDATE
LeftMouseUpAction=[wscript.exe "#@#RunUpdate.vbs" "check"]

[MeterInstall]
Meter=String
X=144
Y=184
W=118
H=28
SolidColor=231,229,222,12
Padding=10,6,10,6
FontFace=#MonoFont#
FontSize=7
FontColor=#Silver#
AntiAlias=1
Text=INSTALL UPDATE
LeftMouseUpAction=[wscript.exe "#@#RunUpdate.vbs" "install"]

[MeterAuto]
Meter=String
X=276
Y=184
W=136
H=28
SolidColor=231,229,222,12
Padding=10,6,10,6
FontFace=#MonoFont#
FontSize=7
FontColor=#Silver#
AntiAlias=1
Text=AUTO UPDATE  #AutoUpdateLabel#
DynamicVariables=1
LeftMouseUpAction=[wscript.exe "#@#SettingsAction.vbs" "toggle-auto"]
ToolTipText=Toggle automatic updates

[MeterProfileRule]
Meter=Image
X=18
Y=229
W=394
H=1
SolidColor=231,229,222,28

[MeterProfileLabel]
Meter=String
X=18
Y=251
FontFace=#MonoFont#
FontSize=7
FontColor=#Muted#
AntiAlias=1
Text=WINDOWS PROFILES

[MeterProfileState]
Meter=String
X=412
Y=251
StringAlign=RightTop
FontFace=#MonoFont#
FontSize=7
FontColor=#ProfileColor#
AntiAlias=1
Text=#ProfileState#
DynamicVariables=1

[MeterProfileDetail]
Meter=String
X=18
Y=273
W=260
H=26
FontFace=#UIFont#
FontSize=8
FontColor=#Muted#
AntiAlias=1
ClipString=2
Text=#ProfileDetail#
DynamicVariables=1

[MeterProfileSetup]
Meter=String
X=296
Y=274
W=116
H=28
SolidColor=231,229,222,12
Padding=10,6,10,6
FontFace=#MonoFont#
FontSize=7
FontColor=#Silver#
AntiAlias=1
Text=SETUP / REPAIR
LeftMouseUpAction=[wscript.exe "#@#SettingsAction.vbs" "profiles"]

[MeterFooterRule]
Meter=Image
X=18
Y=316
W=394
H=1
SolidColor=231,229,222,28

[MeterRepo]
Meter=String
X=18
Y=338
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Warm#
AntiAlias=1
Text=GITHUB REPOSITORY
LeftMouseUpAction=["https://github.com/porthex/windows-porthex-theme"]

[MeterDocs]
Meter=String
X=412
Y=338
StringAlign=RightCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Warm#
AntiAlias=1
Text=SETUP GUIDE
LeftMouseUpAction=["https://github.com/porthex/windows-porthex-theme/blob/main/docs/SETUP.md"]
