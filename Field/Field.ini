[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=0
ContextTitle=Porthex settings
ContextAction=[!ActivateConfig "WindowsPorthexTheme\Settings" "Settings.ini"]

[Metadata]
Name=Silver Field
Author=Hermes
Information=Low-motion click-through desktop field.
Version=1.0

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Profile.inc

[MeterField]
Meter=Image
ImageName=#@#field-overlay.png
X=0
Y=0
W=#SCREENAREAWIDTH#
H=(#SCREENAREAHEIGHT#-44)
PreserveAspectRatio=0
ImageAlpha=#ProfileFieldBase#
