[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
ContextTitle=Hide AI Accounts
ContextAction=[!DeactivateConfig "WindowsPorthexTheme\AIAccounts"]
ContextTitle2=Open ChatGPT subscription
ContextAction2=["https://chatgpt.com/#settings/Subscription"]
ContextTitle3=Porthex settings
ContextAction3=[!ActivateConfig "WindowsPorthexTheme\Settings" "Settings.ini"]
ContextTitle4=Refresh AI accounts
ContextAction4=[wscript.exe "#@#UpdateAIAccounts.vbs"]

[Metadata]
Name=AI Accounts
Author=Hermes
Information=Renewal and usage-limit summary for two ChatGPT accounts.
Version=1.0

[Variables]
@Include=#@#Variables.inc
Account1=GPT ACCOUNT 1
Plan1=NOT CONNECTED
Renewal1=BILLING RENEWAL: CHECK CHATGPT
Usage1=ADD ACCOUNT WITH HERMES AUTH
UsageAlt1=--
Remaining1=0
Color1=154,96,88,255
DateColor1=129,127,120,210
Account2=GPT ACCOUNT 2
Plan2=NOT CONNECTED
Renewal2=BILLING RENEWAL: CHECK CHATGPT
Usage2=ADD ACCOUNT WITH HERMES AUTH
UsageAlt2=--
Remaining2=0
Color2=154,96,88,255
DateColor2=129,127,120,210
AIAccountsUpdated=NEVER

[MeasureLiveUpdate]
Measure=Plugin
Plugin=RunCommand
Program=wscript.exe
Parameter=""#@#UpdateAIAccounts.vbs""
State=Hide
UpdateDivider=-1

[MeasureAutoRefresh]
Measure=Calc
Formula=Counter
UpdateDivider=300
OnChangeAction=[!CommandMeasure MeasureLiveUpdate "Run"]

[MeasureRemaining1]
Measure=Calc
Formula=#Remaining1#
MinValue=0
MaxValue=100
DynamicVariables=1

[MeasureRemaining2]
Measure=Calc
Formula=#Remaining2#
MinValue=0
MaxValue=100
DynamicVariables=1

[MeterPanel]
Meter=Image
X=0
Y=0
W=344
H=230
SolidColor=19,21,21,245

[MeterHeaderRule]
Meter=Image
X=0
Y=46
W=344
H=1
SolidColor=231,229,222,28

[MeterKicker]
Meter=String
X=16
Y=23
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=8
FontColor=#Silver#
StringCase=Upper
AntiAlias=1
Text=AI ACCOUNTS

[MeterHeaderState]
