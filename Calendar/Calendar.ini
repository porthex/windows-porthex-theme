[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
ContextTitle3=Porthex settings
ContextAction3=[!ActivateConfig "WindowsPorthexTheme\Settings" "Settings.ini"]
ContextTitle=Hide Calendar
ContextAction=[!DeactivateConfig "WindowsPorthexTheme\Calendar"]
ContextTitle2=Refresh Google data
ContextAction2=[wscript.exe "#@#UpdateGoogleWidgets.vbs"]

[Metadata]
Name=Calendar
Author=Hermes
Information=Optional local date and calendar surface.
Version=1.0

[Variables]
@Include=#@#Variables.inc
CalendarStatus=GOOGLE LOGIN REQUIRED
CalendarDetail=Complete the Google browser authorization.

[MeasureDayNumber]
Measure=Time
Format=%d

[MeasureWeekday]
Measure=Time
Format=%A

[MeasureMonthYear]
Measure=Time
Format=%B / %Y

[MeasureWeek]
Measure=Time
Format=WEEK %W

[MeterPanel]
Meter=Image
X=0
Y=0
W=344
H=226
SolidColor=19,21,21,245

[MeterPanelRule]
Meter=Image
X=0
Y=46
W=344
H=1
SolidColor=231,229,222,28

[MeterKicker]
Meter=String
X=16
Y=23
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Text=CALENDAR / LOCAL

[MeterDay]
Meter=String
MeasureName=MeasureDayNumber
X=16
Y=84
StringAlign=LeftCenter
FontFace=#DisplayFont#
FontSize=34
FontColor=#Silver#
AntiAlias=1
Text=%1

[MeterWeekday]
Meter=String
MeasureName=MeasureWeekday
X=328
Y=70
StringAlign=RightCenter
FontFace=#UIFont#
FontSize=8
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Text=%1

[MeterMonth]
Meter=String
MeasureName=MeasureMonthYear
X=328
Y=87
StringAlign=RightCenter
FontFace=#UIFont#
FontSize=8
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Text=%1

[MeterDivider]
Meter=Image
X=16
Y=118
W=312
H=1
SolidColor=231,229,222,24

[MeterWeekLabel]
Meter=String
MeasureName=MeasureWeek
X=16
Y=145
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Muted#
AntiAlias=1
Text=%1

[MeterStatus]
Meter=String
X=16
Y=177
StringAlign=LeftCenter
FontFace=#UIFont#
FontSize=9
FontColor=#Warm#
AntiAlias=1
Text=#CalendarStatus#
DynamicVariables=1

[MeterStatus2]
Meter=String
X=16
Y=196
StringAlign=LeftCenter
FontFace=#UIFont#
FontSize=8
FontColor=#Muted#
AntiAlias=1
Text=#CalendarDetail#
DynamicVariables=1
