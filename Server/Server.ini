[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=0
ContextTitle4=Porthex settings
ContextAction4=[!ActivateConfig "WindowsPorthexTheme\Settings" "Settings.ini"]
ContextTitle=Hide Server Dashboard
ContextAction=[!DeactivateConfig "WindowsPorthexTheme\Server"]
ContextTitle2=Refresh Server Status
ContextAction2=[wscript.exe "#@#UpdateServerStatus.vbs"]
ContextTitle3=Open Hermes
ContextAction3=["https://sv1.porthex.io/hermes/"]

[Metadata]
Name=Porthex Server Dashboard
Author=Hermes
Information=Quick server resources and application access.
Version=1.0

[Variables]
@Include=#@#Variables.inc
ServerState=ONLINE
ServerColor=95,210,140,255
ServerCpu=83
ServerMemory=37
ServerDisk=51
ServerUptime=2 days, 13 hours, 39 minutes
AppHermesState=ONLINE
BackupState=FAILED
BackupColor=184,104,88,255
BackupLast=R2 6D AGO / 83a27040
BackupSchedule=HOURLY
AvoroState=12 DAYS LEFT
AvoroColor=216,210,197,255
AvoroRenewal=RENEW SEP 04

[MeterPanel]
Meter=Image
X=0
Y=0
W=344
H=320
SolidColor=19,21,21,245

[MeterHeaderRule]
Meter=Image
X=0
Y=46
W=344
H=1
SolidColor=231,229,222,28

[MeterKicker]
Meter=String
X=16
Y=23
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=8
FontColor=#Silver#
StringCase=Upper
AntiAlias=1
Text=PORTHEX SERVER

[MeterStateDot]
Meter=Shape
X=262
Y=23
Shape=Ellipse 0,0,4,4 | Fill Color #ServerColor# | StrokeWidth 0
DynamicVariables=1

[MeterState]
Meter=String
X=328
Y=23
StringAlign=RightCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Text=#ServerState#
DynamicVariables=1

[MeterCpuLabel]
Meter=String
X=16
Y=67
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Muted#
Text=CPU

[MeterCpu]
