[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=0
ContextTitle4=Porthex settings
ContextAction4=[!ActivateConfig "WindowsPorthexTheme\Settings" "Settings.ini"]
ContextTitle=Hide Server Dashboard
ContextAction=[!DeactivateConfig "WindowsPorthexTheme\Server"]
ContextTitle2=Refresh Server Status
ContextAction2=[wscript.exe "#@#UpdateServerStatus.vbs"]
ContextTitle3=Open Hermes
ContextAction3=["https://sv1.porthex.io/hermes/"]

[Metadata]
Name=Porthex Server Dashboard
Author=Hermes
Information=Quick server resources and application access.
Version=1.0

[Variables]
@Include=#@#Variables.inc
ServerState=ONLINE
ServerColor=95,210,140,255
ServerCpu=31
ServerMemory=33
ServerDisk=60
ServerUptime=5 days, 11 hours, 50 minutes
AppHermesState=ONLINE
AppOpenDesignState=HEALTHY
BackupState=FAILED
BackupColor=184,104,88,255
BackupLast=R2 11H AGO / f948845f
BackupSchedule=HOURLY

[MeterPanel]
Meter=Image
X=0
Y=0
W=344
H=320
SolidColor=19,21,21,245

[MeterHeaderRule]
Meter=Image
X=0
Y=46
W=344
H=1
SolidColor=231,229,222,28

[MeterKicker]
Meter=String
X=16
Y=23
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Silver#
StringCase=Upper
AntiAlias=1
Text=PORTHEX SERVER

[MeterStateDot]
Meter=Shape
X=262
Y=23
Shape=Ellipse 0,0,4,4 | Fill Color #ServerColor# | StrokeWidth 0
DynamicVariables=1

[MeterState]
Meter=String
X=328
Y=23
StringAlign=RightCenter
FontFace=#MonoFont#
FontSize=6
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Text=#ServerState#
DynamicVariables=1

[MeterCpuLabel]
Meter=String
X=16
Y=67
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=6
FontColor=#Muted#
Text=CPU

[MeterCpu]
Meter=String
X=16
Y=91
StringAlign=LeftCenter
FontFace=#DisplayFont#
FontSize=17
FontColor=#Silver#
AntiAlias=1
Text=#ServerCpu#%
DynamicVariables=1

[MeterMemoryLabel]
Meter=String
X=101
Y=67
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=6
FontColor=#Muted#
Text=MEMORY

[MeterMemory]
Meter=String
X=101
Y=91
StringAlign=LeftCenter
FontFace=#DisplayFont#
FontSize=17
FontColor=#Silver#
AntiAlias=1
Text=#ServerMemory#%
DynamicVariables=1

[MeterDiskLabel]
Meter=String
X=200
Y=67
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=6
FontColor=#Muted#
Text=DISK

[MeterDisk]
Meter=String
X=200
Y=91
StringAlign=LeftCenter
FontFace=#DisplayFont#
FontSize=17
FontColor=#Silver#
AntiAlias=1
Text=#ServerDisk#%
DynamicVariables=1

[MeterUptime]
Meter=String
X=16
Y=112
W=312
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=6
FontColor=#Muted#
AntiAlias=1
ClipString=1
Text=UP #ServerUptime#
DynamicVariables=1

[MeterResourceRule]
Meter=Image
X=16
Y=126
W=312
H=1
SolidColor=231,229,222,20

[MeterHermesHit]
Meter=Image
X=8
Y=134
W=328
H=50
SolidColor=231,229,222,5
LeftMouseUpAction=["https://sv1.porthex.io/hermes/"]
ToolTipText=Open Hermes dashboard

[MeterHermesName]
Meter=String
X=16
Y=153
StringAlign=LeftCenter
FontFace=#UIFont#
FontSize=9
FontColor=#Silver#
AntiAlias=1
Text=Hermes

[MeterHermesState]
Meter=String
X=328
Y=153
StringAlign=RightCenter
FontFace=#MonoFont#
FontSize=6
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Text=#AppHermesState#
DynamicVariables=1

[MeterHermesRoute]
Meter=String
X=16
Y=170
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=6
FontColor=#Muted#
AntiAlias=1
