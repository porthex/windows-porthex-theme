[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
ContextTitle=Porthex settings
ContextAction=[!ActivateConfig "WindowsPorthexTheme\Settings" "Settings.ini"]

[Metadata]
Name=Desktop Top Bar
Author=Hermes
Information=Graphite and warm-silver desktop status bar.
Version=1.0

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Profile.inc

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeasureVolume]
Measure=Plugin
Plugin=Win7AudioPlugin

[MeasureVolumePercent]
Measure=Calc
Formula=MeasureVolume

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
UpdateDivider=30

[MeterBar]
Meter=Image
X=0
Y=0
W=#SCREENAREAWIDTH#
H=44
SolidColor=16,18,18,255

[MeterRule]
Meter=Image
X=0
Y=43
W=#SCREENAREAWIDTH#
H=1
SolidColor=231,229,222,18

[MeterWorkspaceActive]
Meter=Shape
X=#ProfileIndicatorX#
Y=10
Shape=Rectangle 0,0,24,24,2 | Fill Color 255,255,255,15 | StrokeWidth 0
DynamicVariables=1

[MeterWorkspace1]
Meter=String
X=30
Y=22
StringAlign=CenterCenter
FontFace=#MonoFont#
FontSize=8
FontColor=#Silver#
AntiAlias=1
Text=01
LeftMouseUpAction=[wscript.exe "#@#SetProfile.vbs" "quiet"]
ToolTipText=Quiet profile

[MeterWorkspace2]
Meter=String
X=59
Y=22
StringAlign=CenterCenter
FontFace=#MonoFont#
FontSize=8
FontColor=#Muted#
AntiAlias=1
Text=02
LeftMouseUpAction=[wscript.exe "#@#SetProfile.vbs" "work"]
ToolTipText=Work profile

[MeterWorkspace3]
Meter=String
X=88
Y=22
StringAlign=CenterCenter
FontFace=#MonoFont#
FontSize=8
FontColor=#Muted#
AntiAlias=1
Text=03
LeftMouseUpAction=[wscript.exe "#@#SetProfile.vbs" "focus"]
ToolTipText=Deep Focus profile

[MeterContext]
Meter=String
X=116
Y=22
StringAlign=LeftCenter
FontFace=#UIFont#
FontSize=8
FontColor=#Muted#
AntiAlias=1
Text=PROFILE

[MeterFocusDot]
Meter=Shape
X=(#SCREENAREAWIDTH#/2-24)
Y=22
Shape=Ellipse 0,0,6,6 | Fill Color #Silver# | StrokeWidth 0

[MeterFocus]
Meter=String
X=(#SCREENAREAWIDTH#/2-10)
Y=22
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=8
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Text=#ProfileName#

[MeterNetDown]
Meter=String
MeasureName=MeasureNetIn
X=(#SCREENAREAWIDTH#-222)
Y=22
W=70
H=18
StringAlign=RightCenter
FontFace=#UIFont#
FontSize=8
FontColor=#Warm#
AntiAlias=1
AutoScale=1
NumOfDecimals=0
Text=%1B/s DOWN

[MeterNetUp]
Meter=String
MeasureName=MeasureNetOut
X=(#SCREENAREAWIDTH#-145)
Y=22
W=65
H=18
StringAlign=RightCenter
FontFace=#UIFont#
FontSize=8
FontColor=#Muted#
AntiAlias=1
AutoScale=1
NumOfDecimals=0
Text=%1B/s UP

[MeterVolume]
Meter=String
MeasureName=MeasureVolumePercent
X=(#SCREENAREAWIDTH#-90)
Y=22
StringAlign=RightCenter
FontFace=#UIFont#
FontSize=8
FontColor=#Warm#
AntiAlias=1
Text=VOL %1

[MeterBattery]
Meter=String
MeasureName=MeasureBattery
X=(#SCREENAREAWIDTH#-48)
Y=22
StringAlign=RightCenter
FontFace=#UIFont#
FontSize=8
FontColor=#Warm#
AntiAlias=1
Text=%1%

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=(#SCREENAREAWIDTH#-20)
Y=22
StringAlign=RightCenter
FontFace=#UIFont#
FontSize=8
FontColor=#Silver#
AntiAlias=1
Text=%1
