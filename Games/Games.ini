[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=0
ContextTitle=Hide Game Vault
ContextAction=[!DeactivateConfig "WindowsPorthexTheme\Games"]
ContextTitle2=Open Steam Library
ContextAction2=["steam://open/games"]
ContextTitle3=Porthex settings
ContextAction3=[!ActivateConfig "WindowsPorthexTheme\Settings" "Settings.ini"]

[Metadata]
Name=Porthex Game Vault
Author=Hermes
Information=Logo launcher for every installed game.
Version=1.5

[Variables]
@Include=#@#Variables.inc

[MeterPanel]
Meter=Image
X=0
Y=0
W=344
H=171
SolidColor=19,21,21,245

[MeterHeaderRule]
Meter=Image
X=0
Y=46
W=344
H=1
SolidColor=231,229,222,28

[MeterKicker]
Meter=String
X=16
Y=23
StringAlign=LeftCenter
FontFace=#MonoFont#
FontSize=8
FontColor=#Silver#
StringCase=Upper
AntiAlias=1
Text=GAME VAULT

[MeterStateDot]
Meter=Shape
X=265
Y=23
Shape=Ellipse 0,0,3,3 | Fill Color #Focus# | StrokeWidth 0

[MeterState]
Meter=String
X=328
Y=23
StringAlign=RightCenter
FontFace=#MonoFont#
FontSize=7
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Text=09 READY

[MeterGame1Back]
Meter=Image
Group=Game1
X=37
Y=57
W=49
H=49
SolidColor=231,229,222,7

