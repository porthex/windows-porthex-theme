name: verify-package
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python helpers
        shell: pwsh
        run: Get-ChildItem '@Resources' -Filter '*.py' | ForEach-Object { python -m py_compile $_.FullName }
      - name: Run package tests
        run: python -m unittest discover -s tests -v
      - name: Build release package
        shell: pwsh
        run: .\Build-Release.ps1 -Version 0.0.0
